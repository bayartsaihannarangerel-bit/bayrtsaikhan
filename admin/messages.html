<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — Admin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <nav class="admin-nav">
    <span class="nav-brand">bsn<span>.</span> admin</span>
    <a href="dashboard.html">Dashboard</a>
    <a href="projects.html">Projects</a>
    <a href="skills.html">Skills</a>
    <a href="messages.html" class="active">Messages</a>
    <button onclick="doLogout()">Гарах</button>
  </nav>

  <div class="admin-container">
    <h1>Messages</h1>
    <div id="messages-list">
      <p style="color:var(--text-muted)">Ачаалж байна...</p>
    </div>
  </div>

  <script type="module">
    import { supabase } from '../js/supabase.js'
    import { requireAuth, logout } from './js/auth.js'

    await requireAuth()
    window.doLogout = logout

    async function loadMessages() {
      const { data, error } = await supabase
        .from('contacts')
        .select('*')
        .order('created_at', { ascending: false })

      const list = document.getElementById('messages-list')

      if (error) {
        list.innerHTML = `<p style="color:var(--accent2)">Алдаа: ${error.message}</p>`
        return
      }

      if (!data || data.length === 0) {
        list.innerHTML = '<div class="empty-state"><p>Одоогоор мессеж байхгүй байна.</p></div>'
        return
      }

      list.innerHTML = data.map(m => `
        <div class="admin-card ${m.is_read ? '' : 'unread'}" style="flex-direction:column;align-items:flex-start;gap:12px;">
          <div style="display:flex;align-items:center;justify-content:space-between;width:100%;flex-wrap:wrap;gap:8px;">
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
              <strong style="font-family:var(--font-display);font-size:15px;">${m.name}</strong>
              <span style="font-size:13px;color:var(--accent);">${m.email}</span>
              <span style="font-size:12px;color:var(--text-dim);">${new Date(m.created_at).toLocaleString('mn-MN')}</span>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
              ${m.is_read
                ? '<span class="read-badge">✓ Уншсан</span>'
                : `<span class="unread-badge">● Шинэ</span>`
              }
              ${!m.is_read
                ? `<button onclick="markRead('${m.id}')" style="padding:5px 12px;border-radius:8px;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;">Уншсан тэмдэглэх</button>`
                : ''
              }
              <button onclick="deleteMsg('${m.id}')" class="danger" style="padding:5px 12px;border-radius:8px;font-size:13px;border:1px solid rgba(255,101,132,0.2);background:rgba(255,101,132,0.05);color:var(--accent2);cursor:pointer;">Устгах</button>
            </div>
          </div>
          <p style="font-size:14px;color:var(--text-muted);line-height:1.6;border-left:2px solid var(--border);padding-left:12px;">${m.message}</p>
        </div>
      `).join('')
    }

    window.markRead = async (id) => {
      const { error } = await supabase
        .from('contacts')
        .update({ is_read: true })
        .eq('id', id)
      if (error) {
        alert('Алдаа: ' + error.message)
      } else {
        loadMessages()
      }
    }

    window.deleteMsg = async (id) => {
      if (!confirm('Энэ мессежийг устгах уу?')) return
      const { error } = await supabase
        .from('contacts')
        .delete()
        .eq('id', id)
      if (error) {
        alert('Алдаа: ' + error.message)
      } else {
        loadMessages()
      }
    }

    loadMessages()
  </script>
</body>
</html>
