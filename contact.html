<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Холбоо барих — Bayrtsaikhan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav>
    <a href="index.html" class="logo">Bayrt<span>.</span></a>
    <a href="index.html">Нүүр</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Холбоо барих</a>
  </nav>

  <div class="contact-section" style="padding-top: 120px;">
    <div class="hero-label" style="margin-bottom: 20px;">Холбоо барих</div>
    <h1>Ярилцацгаая</h1>
    <p style="color: var(--text-muted); margin: 12px 0 40px; font-size: 15px;">
      Ажлын санал, хамтын ажиллагаа эсвэл зүгээр л сайн байна уу гэж бичиж болно.
    </p>

    <form id="contact-form">
      <div class="form-group">
        <label>Нэр</label>
        <input type="text" id="name" placeholder="Таны нэр" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="name@email.com" required>
      </div>
      <div class="form-group">
        <label>Мессеж</label>
        <textarea id="message" placeholder="Юу хэлмээр байна..." required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Илгээх</button>
      <p id="form-msg"></p>
    </form>
  </div>

  <script type="module">
    import { supabase } from './js/supabase.js'

    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = e.target.querySelector('button[type="submit"]')
      const msg = document.getElementById('form-msg')
      btn.textContent = 'Илгээж байна...'
      btn.disabled = true
      msg.textContent = ''
      msg.style.color = 'var(--accent3)'

      const { error } = await supabase.from('contacts').insert({
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      })

      if (error) {
        msg.textContent = '❌ Алдаа гарлаа. Дахин оролдоно уу.'
        msg.style.color = 'var(--accent2)'
        btn.textContent = 'Илгээх'
        btn.disabled = false
      } else {
        msg.textContent = '✅ Амжилттай илгээлээ! Удахгүй холбогдоно.'
        e.target.reset()
        btn.textContent = 'Илгээх'
        btn.disabled = false
      }
    })
  </script>
</body>
</html>
