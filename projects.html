<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects — Bayrtsaikhan</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav>
    <a href="index.html" class="logo">bsn<span>.</span></a>
    <a href="index.html">Нүүр</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Холбоо барих</a>
  </nav>

  <section style="padding-top: 120px;">
    <div class="section-header">
      <span class="section-tag">Work</span>
      <h2>Бүх Projects</h2>
    </div>
    <div id="projects-grid"></div>
  </section>

  <script type="module">
    import { supabase } from './js/supabase.js'

    async function loadProjects() {
      const grid = document.getElementById('projects-grid')

      const { data, error } = await supabase
        .from('projects')
        .select('*')
        .order('created_at', { ascending: false })

      if (error) {
        console.error('Supabase error:', error)
        grid.innerHTML = `<p style="color:var(--accent2)">Алдаа гарлаа: ${error.message}</p>`
        return
      }

      if (!data || data.length === 0) {
        grid.innerHTML = '<div class="empty-state"><p>Projects удахгүй нэмэгдэнэ.</p></div>'
        return
      }

      grid.innerHTML = data.map(p => `
        <div class="card">
          ${p.image_url ? `<img src="${p.image_url}" alt="${p.title}">` : ''}
          <div class="card-body">
            <h3>${p.title}</h3>
            <p>${p.description || ''}</p>
            <div class="tags">${(p.tags || []).map(t => `<span>${t}</span>`).join('')}</div>
            <div class="links">
              ${p.github_url ? `<a href="${p.github_url}" target="_blank">↗ GitHub</a>` : ''}
              ${p.live_url ? `<a href="${p.live_url}" target="_blank">↗ Live</a>` : ''}
            </div>
          </div>
        </div>
      `).join('')
    }

    loadProjects()
  </script>
</body>
</html>
